name: Windows 7 installer

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Версия Rust, на которой std для Windows 7 собрана и проверена (nightly 2026-10-15 её не собирает).
  WIN7_TOOLCHAIN: 1.99.1
  # Архив WebView2 Fixed Version 109 лежит в релизе репозитория: в git его не храним (файл больше лимита GitHub 100 МБ).
  WEBVIEW2_RELEASE_TAG: webview2-109
  WEBVIEW2_ASSET: WebView2-109.zip

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.WIN7_TOOLCHAIN }}
          components: rust-src

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Скачать WebView2 Fixed Version 109
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download $env:WEBVIEW2_RELEASE_TAG --repo ${{ github.repository }} --pattern $env:WEBVIEW2_ASSET --dir $env:RUNNER_TEMP
          Expand-Archive -Path "$env:RUNNER_TEMP/$env:WEBVIEW2_ASSET" -DestinationPath src-tauri/WebView2
          if (-not (Test-Path src-tauri/WebView2/msedgewebview2.exe)) { throw 'В архиве нет msedgewebview2.exe в корне' }

      - run: pnpm install --frozen-lockfile

      - run: pnpm build:win7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Падает, если в обычной таблице импорта exe есть функции Windows 8+ (см. docs/windows7.md, 4.6).
      - name: Проверить импорты exe
        run: python -B scripts/win7-imports.py src-tauri/target/x86_64-win7-windows-msvc/release/tulsu-pe-timetable.exe

      - uses: actions/upload-artifact@v7
        with:
          name: tulsu-pe-timetable-win7
          path: src-tauri/target/x86_64-win7-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
